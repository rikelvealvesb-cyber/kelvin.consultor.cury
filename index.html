<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Navegação Minimalista</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; }
        
        /* Estilo Minimalista do Mapa (CartoDB Positron) */
        .leaflet-container { background: #f8f9fa; }
        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; } /* Esconder controles padrão */
        
        /* Esconder o container de rota padrão do LRM */
        .leaflet-routing-container { display: none !important; }

        /* UI de Navegação (Estilo Google Maps) */
        #nav-top-card { transition: all 0.4s ease-in-out; }
        #nav-bottom-card { transition: transform 0.3s ease-out; transform: translateY(100%); }
        #nav-bottom-card.active { transform: translateY(0); }

        /* Custom User Marker Pulsando */
        .user-marker-ring {
            width: 24px; height: 24px;
            background: rgba(66, 133, 244, 0.2);
            border-radius: 50%;
            position: absolute;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .user-marker-dot {
            width: 12px; height: 12px;
            background: #4285f4;
            border: 3px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 6px; left: 6px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 0; }
            80% { transform: scale(0.33); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col relative antialiased">

    <!-- Mapa -->
    <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- UI Superior: Busca e Destino (Cartão Flutuante) -->
    <div id="nav-top-card" class="absolute top-4 left-4 right-4 md:top-6 md:left-6 md:w-96 z-10 space-y-3">
        
        <!-- Campo de Pesquisa Inicial -->
        <div id="search-box-container" class="bg-white p-2 rounded-2xl shadow-lg flex items-center space-x-3 border border-gray-100">
            <button class="p-2 text-gray-500"><i class="fa-solid fa-bars"></i></button>
            <input type="text" id="searchInput" placeholder="Pesquisar destino..." 
                   class="flex-1 py-1.5 text-gray-800 focus:outline-none text-lg font-medium placeholder:font-normal placeholder:text-gray-400">
            <div class="flex items-center space-x-1.5 border-l pl-3 border-gray-100">
                <img src="https://api.dicebear.com/8.x/adventurer/svg?seed=Felix" alt="User" class="w-9 h-9 rounded-full ring-2 ring-gray-100">
            </div>
        </div>

        <!-- Cartão de Rota (Visível apenas quando a rota está ativa) -->
        <div id="route-active-card" class="bg-white p-4 rounded-2xl shadow-2xl hidden border border-gray-100">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center space-x-2">
                    <div id="next-turn-icon" class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white text-3xl">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                    <div>
                        <div id="next-instruction" class="text-3xl font-bold text-gray-900 leading-tight">Vire à direita</div>
                        <div id="next-street" class="text-lg text-gray-600 font-medium">Rua das Flores</div>
                    </div>
                </div>
                <div class="text-right">
                    <div id="distance-remaining" class="text-4xl font-extrabold text-blue-600">800 m</div>
                    <div id="time-arrival" class="text-lg text-gray-500 font-medium mt-0.5">Chegada 14:35</div>
                </div>
            </div>
            <div class="flex items-center justify-between pt-3 border-t border-gray-100 text-gray-600">
                <div class="flex items-center space-x-4">
                   <button onclick="cancelRoute()" class="flex items-center space-x-2 text-lg font-semibold px-4 py-2 rounded-xl bg-gray-50 hover:bg-gray-100 text-red-600">
                       <i class="fa-solid fa-xmark"></i> <span>Sair</span>
                   </button>
                   <span class="text-lg font-medium">Via Av. Principal</span>
                </div>
                <button class="text-blue-600 p-2 text-xl"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>
    </div>

    <!-- UI Inferior: Botões de Transporte e Centralizar -->
    <div id="nav-bottom-card" class="absolute bottom-8 right-4 md:right-6 z-10 flex flex-col items-end space-y-4">
        
        <!-- Botões de Transporte (Carro, A pé) -->
        <div id="transport-modes" class="bg-white p-2 rounded-full shadow-xl flex items-center space-x-1.5 border border-gray-100">
            <button onclick="setProfile('driving')" id="btnDriving" class="w-14 h-14 rounded-full flex items-center justify-center text-blue-600 bg-blue-50 text-2xl transition">
                <i class="fa-solid fa-car"></i>
            </button>
            <button onclick="setProfile('walking')" id="btnWalking" class="w-14 h-14 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 text-2xl transition">
                <i class="fa-solid fa-person-walking"></i>
            </button>
        </div>

        <!-- Botão de Centralizar -->
        <button onclick="centerOnUser()" class="w-16 h-16 bg-white shadow-xl hover:bg-gray-50 rounded-full flex items-center justify-center text-blue-600 text-3xl transition border border-gray-100" title="Minha Localização">
            <i class="fa-solid fa-location-arrow"></i>
        </button>
    </div>

    <script>
        let map;
        let userMarker = null;
        let routingControl = null;
        let currentProfile = 'driving';
        let userLatLng = null;
        let destinationMarker = null;
        let isFollowing = true; // Modo de acompanhamento ativado ao iniciar

        // Inicializar Mapa Minimalista (CartoDB Positron)
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                // Desativar interações excessivas no modo navegação
                boxZoom: false,
                doubleClickZoom: false,
                dragging: true, // Necessário para mover
                tap: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                // Minimalista, sem labels de países, apenas ruas e água. Idealmente usa-se CartoDB.
                // Para fins de demonstração e estabilidade, usamos o padrão, mas escondendo UI.
            }).addTo(map);

            startLocationWatch();

            // Clicar no mapa define destino e inicia rota
            map.on('click', function(e) {
                setDestination(e.latlng);
            });
        }

        // Geolocalização contínua e centralização automática inicial
        function startLocationWatch() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        userLatLng = L.latLng(lat, lng);
                        updateUserMarker(userLatLng);

                        if (isFollowing) {
                            map.setView(userLatLng, 17); // Zoom alto e segue usuário
                        }
                    },
                    (err) => console.warn('GPS Error', err),
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            } else {
                alert("Geolocalização não suportada.");
            }
        }

        // Marcador de usuário personalizado (Ponto + Anel)
        function updateUserMarker(latlng) {
            if (!userMarker) {
                const pulsingIcon = L.divIcon({
                    className: 'user-marker-icon',
                    html: '<div class="user-marker-ring"></div><div class="user-marker-dot"></div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
                userMarker = L.marker(latlng, { icon: pulsingIcon, zIndexOffset: 1000 }).addTo(map);
            } else {
                userMarker.setLatLng(latlng);
            }
        }

        function centerOnUser() {
            isFollowing = true;
            if (userLatLng) {
                map.setView(userLatLng, 17, { animate: true });
            }
        }

        // Selecionar perfil de transporte
        function setProfile(profile) {
            currentProfile = profile;
            ['driving', 'walking'].forEach(p => {
                const btn = document.getElementById(`btn${p.charAt(0).toUpperCase() + p.slice(1)}`);
                btn.className = "w-14 h-14 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 text-2xl transition";
            });
            const activeBtn = document.getElementById(`btn${profile.charAt(0).toUpperCase() + profile.slice(1)}`);
            activeBtn.className = "w-14 h-14 rounded-full flex items-center justify-center text-blue-600 bg-blue-50 text-2xl transition";

            if (destinationMarker) {
                calculateAndShowRoute(); // Recalcular se destino já existe
            }
        }

        // Iniciar Rota ao clicar no mapa
        function setDestination(latlng) {
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.circleMarker(latlng, { radius: 8, color: '#fff', fillColor: '#ea4335', fillOpacity: 1, weight: 2 }).addTo(map);
            
            // Mudar UI para modo navegação
            document.getElementById('search-box-container').classList.add('hidden');
            document.getElementById('nav-top-card').classList.add('active-route');
            document.getElementById('route-active-card').classList.remove('hidden');
            document.getElementById('nav-bottom-card').classList.add('active');
            
            isFollowing = true; // Iniciar seguindo a rota
            calculateAndShowRoute();
        }

        // Calcular e exibir a rota usando OSRM
        function calculateAndShowRoute() {
            if (!userLatLng || !destinationMarker) return;

            if (routingControl) map.removeControl(routingControl);

            let routerService = L.Routing.osrmv1({
                serviceUrl: 'https://router.project-osrm.org/route/v1',
                profile: currentProfile === 'walking' ? 'foot' : 'car'
            });

            routingControl = L.Routing.control({
                waypoints: [userLatLng, destinationMarker.getLatLng()],
                router: routerService,
                routeWhileDragging: false,
                show: false, // Esconder painel padrão
                lineOptions: {
                    styles: [
                        { color: '#1a73e8', opacity: 0.8, weight: 8 }, // Borda azul principal
                        { color: '#fff', opacity: 0.5, weight: 10 } // Efeito de contorno branco (minimalista)
                    ]
                },
                // Ajustar o zoom para focar na rota inteira no início
                fitSelectedRoutes: true,
            }).addTo(map);

            // Simular dados da próxima instrução (OSRM não expõe isso facilmente em tempo real no client-side sem parsear o objeto inteiro)
            // Em um app real, você usaria os eventos de 'routesfound' do LRM para extrair os dados.
            // Aqui vamos apenas atualizar os campos com dados fictícios para demonstrar a UI.
            updateNavigationInstruction("Vire à esquerda", "Rua Principal", "500 m", "10 min");
        }

        // Função para atualizar o cartão de instrução de navegação
        function updateNavigationInstruction(instruction, street, distance, time) {
             document.getElementById('next-instruction').innerText = instruction;
             document.getElementById('next-street').innerText = street;
             document.getElementById('distance-remaining').innerText = distance;
             document.getElementById('time-arrival').innerText = `Chegada ${time}`;
             // Ícone muda dependendo da instrução (simplificado)
             if(instruction.includes('direita')) document.getElementById('next-turn-icon').innerHTML = '<i class="fa-solid fa-arrow-right"></i>';
             else if(instruction.includes('esquerda')) document.getElementById('next-turn-icon').innerHTML = '<i class="fa-solid fa-arrow-left"></i>';
             else document.getElementById('next-turn-icon').innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
        }

        function cancelRoute() {
            if (routingControl) map.removeControl(routingControl);
            if (destinationMarker) map.removeLayer(destinationMarker);
            routingControl = null;
            destinationMarker = null;
            isFollowing = true;

            // Restaurar UI inicial
            document.getElementById('search-box-container').classList.remove('hidden');
            document.getElementById('route-active-card').classList.add('hidden');
            document.getElementById('nav-bottom-card').classList.remove('active');
            
            if (userLatLng) map.setView(userLatLng, 17);
        }

        window.onload = initMap;

    </script>
</body>
</html>
