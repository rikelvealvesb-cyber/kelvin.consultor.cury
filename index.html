<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>PoleMaps</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; overflow: hidden; background-color: #121212; user-select: none; position: fixed; inset: 0; }
        
        .leaflet-container { background: #1a1a1a !important; }
        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }
        .leaflet-routing-container { display: none !important; }

        .user-pulse {
            width: 36px; height: 36px;
            background: rgba(66, 133, 244, 0.25);
            border-radius: 50%;
            position: absolute;
            animation: pulse-ring 2s infinite;
        }
        .user-dot {
            width: 16px; height: 16px;
            background: #4285f4;
            border: 3px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 10px; left: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .panel-slide { transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
    </style>
</head>
<body class="h-full w-full flex flex-col relative text-gray-100">

    <!-- MAPA -->
    <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- TELA PRINCIPAL -->
    <div id="view-home" class="absolute inset-0 z-10 flex flex-col justify-between pointer-events-none p-3 pb-16">
        
        <!-- Barra de Pesquisa com Autocomplete -->
        <div class="pointer-events-auto">
            <div class="bg-[#2d2d2d] shadow-2xl rounded-full flex items-center px-4 py-3 mx-1 mt-3 border border-gray-700/60">
                <button onclick="clearSearch()" class="text-gray-300 mr-3 text-lg hover:text-white transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <input type="text" id="searchInput" placeholder="Pesquisar no PoleMaps..." oninput="handleSearchInput(event)"
                       class="flex-1 bg-transparent text-gray-100 placeholder:text-gray-400 focus:outline-none text-base font-normal">
                <button class="text-gray-300 mx-2 text-lg hover:text-white transition">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs text-white shadow">US</div>
            </div>

            <div id="suggestionsBox" class="absolute left-4 right-4 mt-2 bg-[#1e1e1e] border border-gray-700 rounded-2xl shadow-2xl hidden max-h-60 overflow-y-auto z-30"></div>
        </div>

        <!-- Botão de Centralizar Flutuante (Posicionado mais acima) -->
        <div class="pointer-events-auto flex justify-end px-2 mb-16">
            <button onclick="centerOnUser()" class="w-12 h-12 bg-[#2d2d2d] text-blue-400 shadow-2xl rounded-2xl flex items-center justify-center text-xl border border-gray-700 active:scale-95 transition">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </div>
    </div>

    <!-- OVERLAY DE CARREGAMENTO -->
    <div id="loadingOverlay" class="absolute inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center backdrop-blur-xs">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-white font-medium text-sm tracking-wide">Traçando rota...</p>
    </div>

    <!-- TELA 2: FICHA DO LOCAL SELECIONADO (Painel Inferior Mais Acima) -->
    <div id="view-place-sheet" class="absolute inset-x-0 bottom-6 z-20 mx-3 bg-[#1e1e1e] rounded-3xl shadow-2xl p-5 border border-gray-700 panel-slide translate-y-[120%] flex flex-col max-h-[75vh]">
        <div class="w-12 h-1.5 bg-gray-600 rounded-full mx-auto mb-3"></div>
        
        <div class="flex justify-between items-start mb-2">
            <div>
                <h2 id="sheet-title" class="text-xl font-bold text-gray-100">Local Selecionado</h2>
                <div class="flex items-center space-x-2 text-xs text-gray-400 mt-1">
                    <span class="text-yellow-400 font-bold">4,5 <i class="fa-solid fa-star"></i></span>
                    <span>(12.450)</span>
                    <span>•</span>
                    <span class="text-green-400 font-medium">Aberto</span>
                </div>
            </div>
            <button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-[#2d2d2d] flex items-center justify-center text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <p class="text-xs text-gray-400 mb-3">Ponto de Interesse • PoleMaps</p>

        <!-- Seletor de Veículos e Tempos -->
        <div class="grid grid-cols-3 gap-2 mb-4 bg-[#2d2d2d] p-2 rounded-2xl border border-gray-700">
            <button onclick="selectVehicle('car')" id="vehicleCar" class="flex flex-col items-center p-2 rounded-xl bg-blue-600 text-white transition">
                <i class="fa-solid fa-car text-lg mb-1"></i>
                <span class="text-xs font-bold" id="timeCar">-- min</span>
            </button>
            <button onclick="selectVehicle('bike')" id="vehicleBike" class="flex flex-col items-center p-2 rounded-xl text-gray-300 hover:bg-[#3d3d3d] transition">
                <i class="fa-solid fa-bicycle text-lg mb-1"></i>
                <span class="text-xs font-bold" id="timeBike">-- min</span>
            </button>
            <button onclick="selectVehicle('walk')" id="vehicleWalk" class="flex flex-col items-center p-2 rounded-xl text-gray-300 hover:bg-[#3d3d3d] transition">
                <i class="fa-solid fa-person-walking text-lg mb-1"></i>
                <span class="text-xs font-bold" id="timeWalk">-- min</span>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-2">
            <button onclick="previewRoute()" class="bg-[#2d2d2d] hover:bg-[#3d3d3d] border border-gray-700 text-blue-400 py-3 px-4 rounded-2xl flex items-center justify-center space-x-2 font-medium text-sm transition">
                <i class="fa-solid fa-diamond-turn-right text-base"></i>
                <span>Rotas</span>
            </button>
            <button onclick="startNavigation()" class="bg-blue-600 hover:bg-blue-500 text-white py-3 px-4 rounded-2xl flex items-center justify-center space-x-2 font-medium text-sm shadow-lg transition">
                <i class="fa-solid fa-location-arrow text-base"></i>
                <span>Iniciar</span>
            </button>
        </div>
    </div>

    <!-- TELA 3: NAVEGAÇÃO EM ANDAMENTO -->
    <div id="view-navigation" class="absolute inset-0 z-30 pointer-events-none flex flex-col justify-between p-3 pb-16 hidden">
        <div class="pointer-events-auto bg-[#0f3833] border border-emerald-700/50 rounded-3xl p-4 shadow-2xl flex items-center justify-between mx-1 mt-2">
            <div class="flex items-center space-x-3">
                <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-3xl shadow">
                    <i class="fa-solid fa-arrow-turn-up"></i>
                </div>
                <div>
                    <div class="text-xl font-bold text-gray-100">120 m</div>
                    <div id="nav-street-name" class="text-sm font-medium text-gray-300">Rua Principal</div>
                </div>
            </div>
            <button class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-blue-600 shadow-lg text-xl">
                <i class="fa-solid fa-compass"></i>
            </button>
        </div>

        <div class="pointer-events-auto mx-3 mb-4 bg-[#1e1e1e] border border-gray-800 rounded-3xl p-4 flex items-center justify-between shadow-2xl">
            <button onclick="cancelNavigation()" class="w-12 h-12 rounded-full bg-[#2d2d2d] flex items-center justify-center text-red-400 text-xl border border-gray-700">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="text-center">
                <div id="nav-time" class="text-2xl font-bold text-gray-100">15 min</div>
                <div id="nav-distance" class="text-xs text-gray-400 font-medium">3,2 km</div>
            </div>
            <button class="w-12 h-12 rounded-full bg-[#2d2d2d] flex items-center justify-center text-blue-400 text-xl border border-gray-700">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
        </div>
    </div>

    <script>
        let map;
        let userLatLng = null;
        let userMarker = null;
        let destinationLatLng = null;
        let destinationMarker = null;
        let routingControl = null;
        let isFollowingUser = true;
        let searchTimeout = null;
        let currentVehicle = 'car';

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-23.5505, -46.6333], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

            startRealGeolocation();

            map.on('click', function(e) {
                selectLocation(e.latlng, "Local Selecionado");
            });
        }

        function startRealGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        userLatLng = L.latLng(position.coords.latitude, position.coords.longitude);
                        updateUserMarker(userLatLng);
                        if (isFollowingUser && !routingControl) map.setView(userLatLng, 18);
                    },
                    (err) => {
                        userLatLng = L.latLng(-23.5505, -46.6333);
                        updateUserMarker(userLatLng);
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        function updateUserMarker(latlng) {
            if (!userMarker) {
                const icon = L.divIcon({
                    className: 'user-icon',
                    html: '<div class="user-pulse"></div><div class="user-dot"></div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                userMarker = L.marker(latlng, { icon: icon, zIndexOffset: 1000 }).addTo(map);
            } else {
                userMarker.setLatLng(latlng);
            }
        }

        function centerOnUser() {
            isFollowingUser = true;
            if (userLatLng) map.setView(userLatLng, 19, { animate: true });
        }

        function handleSearchInput(e) {
            const query = e.target.value;
            clearTimeout(searchTimeout);
            const box = document.getElementById('suggestionsBox');

            if (!query || query.length < 3) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                    const data = await res.json();
                    
                    box.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = "px-4 py-3 hover:bg-[#2d2d2d] border-b border-gray-800 text-sm text-gray-200 cursor-pointer flex items-center space-x-2";
                            div.innerHTML = `<i class="fa-solid fa-circle text-blue-400 text-xs mr-1"></i><span class="truncate">${item.display_name}</span>`;
                            div.onclick = () => {
                                document.getElementById('searchInput').value = item.display_name.split(',')[0];
                                box.classList.add('hidden');
                                selectLocation(L.latLng(parseFloat(item.lat), parseFloat(item.lon)), item.display_name.split(',')[0]);
                            };
                            box.appendChild(div);
                        });
                        box.classList.remove('hidden');
                    } else {
                        box.classList.add('hidden');
                    }
                } catch(err) { console.error(err); }
            }, 300);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('suggestionsBox').classList.add('hidden');
            if (destinationMarker) map.removeLayer(destinationMarker);
            if (routingControl) map.removeControl(routingControl);
            routingControl = null;
            destinationMarker = null;
            closeSheet();
            centerOnUser();
        }

        function selectLocation(latlng, name) {
            destinationLatLng = latlng;
            document.getElementById('sheet-title').innerText = name;
            
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.circleMarker(latlng, {
                radius: 7,
                color: '#ffffff',
                fillColor: '#ea4335',
                fillOpacity: 1,
                weight: 2
            }).addTo(map);

            document.getElementById('view-home').classList.add('hidden');
            const sheet = document.getElementById('view-place-sheet');
            sheet.classList.remove('translate-y-[120%]');
            sheet.classList.add('translate-y-0');
            map.setView(latlng, 17, { animate: true });
            estimateTravelTimes();
        }

        function closeSheet() {
            const sheet = document.getElementById('view-place-sheet');
            sheet.classList.remove('translate-y-0');
            sheet.classList.add('translate-y-[120%]');
            document.getElementById('view-home').classList.remove('hidden');
            if (destinationMarker) map.removeLayer(destinationMarker);
            if (routingControl) map.removeControl(routingControl);
            routingControl = null;
        }

        function selectVehicle(vehicle) {
            currentVehicle = vehicle;
            ['car', 'bike', 'walk'].forEach(v => {
                const btn = document.getElementById(`vehicle${v.charAt(0).toUpperCase() + v.slice(1)}`);
                if (v === vehicle) {
                    btn.className = "flex flex-col items-center p-2 rounded-xl bg-blue-600 text-white transition";
                } else {
                    btn.className = "flex flex-col items-center p-2 rounded-xl text-gray-300 hover:bg-[#3d3d3d] transition";
                }
            });
            if (destinationLatLng) calculateRoute(() => {});
        }

        function estimateTravelTimes() {
            if (!userLatLng || !destinationLatLng) return;
            const distMeters = userLatLng.distanceTo(destinationLatLng);
            
            const carMin = Math.max(2, Math.round(distMeters / 600));
            const bikeMin = Math.max(5, Math.round(distMeters / 250));
            const walkMin = Math.max(10, Math.round(distMeters / 80));

            document.getElementById('timeCar').innerText = `${carMin} min`;
            document.getElementById('timeBike').innerText = `${bikeMin} min`;
            document.getElementById('timeWalk').innerText = `${walkMin} min`;
        }

        function previewRoute() {
            closeSheet();
            calculateRoute(() => {});
        }

        function startNavigation() {
            closeSheet();
            calculateRoute(() => {
                document.getElementById('view-navigation').classList.remove('hidden');
                isFollowingUser = true;
                if (userLatLng) map.setView(userLatLng, 20, { animate: true });
            });
        }

        function calculateRoute(onComplete) {
            if (!userLatLng || !destinationLatLng) return;
            document.getElementById('loadingOverlay').classList.remove('hidden');

            if (routingControl) map.removeControl(routingControl);

            let profile = 'car';
            if (currentVehicle === 'bike') profile = 'bike';
            if (currentVehicle === 'walk') profile = 'foot';

            routingControl = L.Routing.control({
                waypoints: [userLatLng, destinationLatLng],
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1', profile: profile }),
                routeWhileDragging: false,
                show: false,
                lineOptions: { styles: [{ color: '#4285f4', opacity: 0.9, weight: 7 }] },
                fitSelectedRoutes: true
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                
                const routes = e.routes;
                if (routes && routes.length > 0 && routes[0].coordinates.length > 1) {
                    const p1 = routes[0].coordinates[0];
                    const p2 = routes[0].coordinates[1];
                    const angle = Math.atan2(p2.lng - p1.lng, p2.lat - p1.lat) * (180 / Math.PI);
                    
                    const mapContainerNode = map.getContainer();
                    if (mapContainerNode) {
                        mapContainerNode.style.transition = 'transform 0.5s ease';
                        mapContainerNode.style.transform = `rotate(${-angle}deg)`;
                    }
                }

                if (onComplete) onComplete();
            });

            routingControl.on('routingerror', function(e) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert("Erro ao traçar a rota.");
            });
        }

        function cancelNavigation() {
            const mapContainerNode = map.getContainer();
            if (mapContainerNode) mapContainerNode.style.transform = 'rotate(0deg)';

            document.getElementById('view-navigation').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            if (routingControl) map.removeControl(routingControl);
            if (destinationMarker) map.removeLayer(destinationMarker);
            routingControl = null;
            destinationMarker = null;
            centerOnUser();
        }

        window.onload = initMap;
    </script>
</body>
</html>
