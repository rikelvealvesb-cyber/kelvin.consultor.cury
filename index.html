<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo com Rotas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .leaflet-routing-container { background-color: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Barra Superior -->
    <header class="bg-white shadow-md z-20 flex items-center justify-between px-4 py-3 shrink-0">
        <div class="flex items-center space-x-3 w-full max-w-lg">
            <div class="flex items-center text-blue-600 font-bold text-xl">
                <i class="fa-solid fa-map-location-dot mr-2"></i>Mapas
            </div>
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="destinationInput" placeholder="Pesquisar destino (ex: Avenida Paulista, SP)..." 
                    class="w-full pl-10 pr-10 py-2 bg-gray-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                <button onclick="searchDestination()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-blue-600 hover:text-blue-800">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-full">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="w-9 h-9 bg-blue-600 text-white rounded-full flex items-center justify-center font-semibold text-sm shadow-sm">
                EU
            </div>
        </div>
    </header>

    <!-- Corpo Principal -->
    <div class="flex flex-1 relative overflow-hidden">

        <!-- Painel Lateral (Sidebar) -->
        <aside id="sidebar" class="absolute md:relative z-10 w-full md:w-96 bg-white h-full shadow-lg flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800 mb-3"><i class="fa-solid fa-diamond-turn-right mr-2 text-blue-600"></i>Navegação em Tempo Real</h2>
                
                <div class="space-y-2 relative">
                    <div class="absolute left-3 top-8 bottom-8 w-0.5 bg-gray-300"></div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-circle-dot text-blue-500 text-xs z-10 pl-1"></i>
                        <input type="text" id="startLocationText" value="Sua Localização Atual" readonly
                            class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none">
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-location-dot text-red-500 text-xs z-10 pl-1"></i>
                        <input type="text" id="endLocationText" placeholder="Digite o destino ou clique no mapa"
                            class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Modos de Transporte -->
                <div class="flex justify-around mt-4 py-2 border-t border-b border-gray-100">
                    <button onclick="setProfile('driving')" id="btnDriving" class="flex flex-col items-center text-blue-600 px-3 py-1 rounded-lg bg-blue-50 font-medium text-xs transition">
                        <i class="fa-solid fa-car text-base mb-1"></i>Carro
                    </button>
                    <button onclick="setProfile('walking')" id="btnWalking" class="flex flex-col items-center text-gray-500 px-3 py-1 rounded-lg hover:bg-gray-100 font-medium text-xs transition">
                        <i class="fa-solid fa-person-walking text-base mb-1"></i>A pé
                    </button>
                    <button onclick="setProfile('bicycling')" id="btnBicycling" class="flex flex-col items-center text-gray-500 px-3 py-1 rounded-lg hover:bg-gray-100 font-medium text-xs transition">
                        <i class="fa-solid fa-bicycle text-base mb-1"></i>Bicicleta
                    </button>
                </div>

                <button onclick="startRouteToDestination()" class="w-full mt-3 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm">
                    Iniciar Rota
                </button>
            </div>

            <!-- Detalhes e Status -->
            <div id="routeInfoPanel" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4">
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-600">Status do GPS</span>
                    <p id="gpsStatusText" class="text-sm font-semibold text-gray-800 mt-1">Buscando sua localização exata...</p>
                </div>

                <div id="routingInstructionsContainer">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Instruções Passo a Passo</h3>
                    <p class="text-xs text-gray-500">Insira um destino para visualizar as orientações de trajeto detalhadas.</p>
                </div>
            </div>
        </aside>

        <!-- Área do Mapa Real -->
        <main class="flex-1 relative bg-slate-100">
            <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

            <!-- Botão de Centralizar na Localização -->
            <div class="absolute bottom-6 right-6 z-10">
                <button onclick="centerOnUser()" class="w-12 h-12 bg-white shadow-xl hover:bg-gray-50 rounded-full flex items-center justify-center text-blue-600 text-lg font-bold transition border border-gray-200" title="Minha Localização">
                    <i class="fa-solid fa-location-crosshairs"></i>
                </button>
            </div>
        </main>
    </div>

    <script>
        let map;
        let userLat = -23.550520; // Padrão São Paulo caso o GPS demore
        let userLng = -46.633308;
        let userMarker = null;
        let routingControl = null;
        let currentTransportProfile = 'driving'; // driving, walking, bicycling
        let destinationLatLng = null;

        // Ícone personalizado azul para o usuário
        const blueUserIcon = L.divIcon({
            className: 'custom-user-marker',
            html: '<div style="background-color: #2563eb; width: 18px; height: 18px; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3);"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        // Inicializar o Mapa
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Obter Geolocalização Real
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        updateUserLocationMarker(userLat, userLng);
                        document.getElementById('gpsStatusText').innerText = "Localização obtida com sucesso.";
                    },
                    (error) => {
                        console.warn("Erro de geolocalização: ", error.message);
                        document.getElementById('gpsStatusText').innerText = "Usando localização padrão (São Paulo). Ative o GPS.";
                        updateUserLocationMarker(userLat, userLng);
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
                );
            } else {
                updateUserLocationMarker(userLat, userLng);
            }

            // Clique no mapa para definir destino
            map.on('click', function(e) {
                destinationLatLng = e.latlng;
                document.getElementById('endLocationText').value = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
                startRouteToDestination();
            });
        }

        function updateUserLocationMarker(lat, lng) {
            if (!userMarker) {
                userMarker = L.marker([lat, lng], { icon: blueUserIcon }).addTo(map).bindPopup("Você está aqui");
            } else {
                userMarker.setLatLng([lat, lng]);
            }
        }

        function centerOnUser() {
            if (userLat && userLng) {
                map.setView([userLat, userLng], 16, { animate: true });
            }
        }

        // Definir Perfil de Transporte
        function setProfile(profile) {
            currentTransportProfile = profile;
            ['driving', 'walking', 'bicycling'].forEach(p => {
                const btnId = 'btn' + p.charAt(0).toUpperCase() + p.slice(1);
                document.getElementById(btnId).className = "flex flex-col items-center text-gray-500 px-3 py-1 rounded-lg hover:bg-gray-100 font-medium text-xs transition";
            });
            const activeId = 'btn' + profile.charAt(0).toUpperCase() + profile.slice(1);
            document.getElementById(activeId).className = "flex flex-col items-center text-blue-600 px-3 py-1 rounded-lg bg-blue-50 font-medium text-xs transition";

            if (destinationLatLng) {
                startRouteToDestination();
            }
        }

        // Pesquisar Destino usando Nominatim (OpenStreetMap Search)
        async function searchDestination() {
            const query = document.getElementById('destinationInput').value;
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const place = data[0];
                    destinationLatLng = L.latLng(parseFloat(place.lat), parseFloat(place.lon));
                    document.getElementById('endLocationText').value = place.display_name.split(',')[0];
                    startRouteToDestination();
                } else {
                    alert("Destino não encontrado.");
                }
            } catch (err) {
                console.error("Erro na busca:", err);
            }
        }

        // Iniciar Rota com Leaflet Routing Machine
        function startRouteToDestination() {
            if (!destinationLatLng) {
                const textQuery = document.getElementById('endLocationText').value;
                if (textQuery) {
                    searchDestination();
                    return;
                }
                return;
            }

            if (routingControl) {
                map.removeControl(routingControl);
            }

            // Mapear perfil para OSRM router
            let routerService = L.Routing.osrmv1({
                serviceUrl: 'https://router.project-osrm.org/route/v1',
                profile: currentTransportProfile === 'bicycling' ? 'bike' : (currentTransportProfile === 'walking' ? 'foot' : 'car')
            });

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userLat, userLng),
                    destinationLatLng
                ],
                router: routerService,
                routeWhileDragging: false,
                language: 'pt',
                lineOptions: {
                    styles: [{ color: '#3b82f6', opacity: 0.8, weight: 6 }]
                },
                showAlternatives: true,
                fitSelectedRoutes: true,
                containerClassName: 'leaflet-routing-container'
            }).addTo(map);

            // Redirecionar container de instruções para o painel lateral
            setTimeout(() => {
                const container = document.querySelector('.leaflet-routing-container');
                if (container) {
                    const targetContainer = document.getElementById('routingInstructionsContainer');
                    targetContainer.innerHTML = '<h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Instruções Passo a Passo</h3>';
                    targetContainer.appendChild(container);
                }
            }, 500);

            // Fechar sidebar em mobile após iniciar rota
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        window.onload = initMap;
    </script>
</body>
</html>
