<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelvin - Consultor Imobiliário Cury</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Importando ícones oficiais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0046be;
            --primary-dark: #002d74;
            --accent: #25d366;
            --insta: #e1306c;
        }

        body { background-color: #f4f6f9; font-family: 'Poppins', sans-serif; color: #2c3e50; margin: 0; }
        
        header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; text-align: center; padding: 3rem 1rem; }
        
        .container { max-width: 850px; margin: 2rem auto; padding: 0 1rem; }
        
        .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); margin-bottom: 2rem; }

        /* Ajuste do Player de Vídeo */
        .video-container {
            width: 100%;
            height: 500px; /* Altura fixa maior para evitar cortes */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container iframe { width: 100%; height: 100%; }

        .btn { display: inline-block; background: var(--primary); color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; text-decoration: none; text-align: center; width: 100%; transition: 0.3s; }
        
        /* Rodapé Social */
        .social-footer { display: flex; justify-content: center; gap: 20px; margin-top: 2rem; padding: 2rem; border-top: 1px solid #ddd; }
        .social-link { font-size: 2.5rem; text-decoration: none; transition: transform 0.3s; }
        .wa { color: var(--accent); }
        .ig { color: var(--insta); }
        .social-link:hover { transform: scale(1.1); }

    </style>
</head>
<body>

    <header>
        <h1>Kelvin - Consultor Imobiliário Cury</h1>
        <p>A melhor experiência imobiliária de São Paulo</p>
    </header>

    <div class="container">
        
        <!-- PLAYER DE VÍDEO SEM CORTES -->
        <div class="card">
            <h2><i class="fa-solid fa-video"></i> Apresentação</h2>
            <div class="video-container">
                <iframe src="https://drive.google.com/file/d/1C-nKUgq283hnYKpIWx5nUxgNXw2BGG7X/preview" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Mantenha aqui o restante do seu formulário e lógica (O fluxo Comprar/Parceiro) -->
        <!-- O código permanece funcional conforme a versão anterior -->

        <!-- RODAPÉ COM LOGOS REAIS -->
        <div class="social-footer">
            <a href="https://wa.me/5511954962246" target="_blank" class="social-link wa">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://www.instagram.com/rikelvecury?igsh=emdnZW5jZmVkY2R5" target="_blank" class="social-link ig">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
        <p style="text-align: center; color: #888;">© 2026 Kelvin - Consultor Cury</p>
    </div>

</body>
</html>
